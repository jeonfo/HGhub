name: Publish APK release

# 取用 #1 构建成功产出的 APK 产物,发布成公开 Release,手机上点链接就能直接下载安装。
on:
  push:
    branches: [fix/android-fullscreen-autohide]
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - name: 下载已构建好的 APK 产物
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh run download 42428919208 -n HGhub-apk -D artifacts --repo "$GITHUB_REPOSITORY"
      - name: 发布到 Release(公开下载)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          ls -lh artifacts
          TAG="v1.1.0-autohide"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" artifacts/*.apk --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$TAG" artifacts/*.apk --repo "$GITHUB_REPOSITORY" \
              --title "HGhub 1.1.0 · 安卓全屏播放条自动隐藏修复" \
              --notes "安卓沉浸全屏下播放条 2.8 秒无操作自动隐藏;轻点画面唤回,这一下不会顺手暂停。"
          fi
