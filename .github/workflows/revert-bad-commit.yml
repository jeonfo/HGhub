name: revert-bad-commit

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  revert:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: 回退误提交 66fee91
        run: |
          git config user.name "jeonfo"
          git config user.email "jeonfo@users.noreply.github.com"
          git revert --no-edit 66fee91
          git rm .github/workflows/revert-bad-commit.yml
          git commit --amend --no-edit
          git push
